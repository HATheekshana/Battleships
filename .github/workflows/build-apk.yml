name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Point invite links at the Pages site
        run: |
          sed -i "s#const WEB=''#const WEB='https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/'#" www/index.html
      - run: npm install
      - run: npx cap add android && python3 patch-manifest.py && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-command-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
